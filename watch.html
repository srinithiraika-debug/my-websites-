
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch House</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #e8e1d8;
      font-family: Arial, sans-serif;
    }

    .hero {
      max-width: 900px;
      margin: 0 auto 25px;
      padding: 24px;
      background: #30271f;
      color: white;
      text-align: center;
      border-radius: 12px;
    }

    .hero h1 {
      margin: 0 0 8px;
      color: #e6c78e;
      letter-spacing: 5px;
    }

    .hero p {
      margin: 0 0 14px;
      color: #f3e8d7;
    }

    .hero img {
      width: 95px;
      height: 95px;
      margin: 0 7px;
      object-fit: cover;
      border: 3px solid #e6c78e;
      border-radius: 50%;
    }
    h1 {
      text-align: center;
      color: #333;
    }

    .grid-parent {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 700px;
      margin: 0 auto;
    }

    .grid-child {
      padding: 25px;
      background-color: white;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 3px 8px #aaa;
    }

    .grid-child img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .price {
      color: #555;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #666;
    }
  </style>
</head>

<body>
  <header class="hero">
    <h1> STYLISH WATCH HOUSE</h1>
    <p>Timeless style for every moment</p>
    
  </header>

  <main class="grid-parent">
    <div class="grid-child">
      <img src="https://images.unsplash.com/photo-1639736922209-793b59a41572?auto=format&fit=crop&w=500&q=80" >
      <h2>Classic Watch</h2>
      <p class="price">₹1,499</p>
      <button type="button">Buy Now</button>
    </div>

    <div class="grid-child">
      <img src="https://images.unsplash.com/photo-1573261821759-fdd1b36d9ca5?auto=format&fit=crop&w=500&q=80">
      <h2>Digital Sports Watch</h2>
      <p class="price">₹1,999</p>
      <button type="button">Buy Now</button>
    </div>

    <div class="grid-child">
      <img src="https://images.unsplash.com/photo-1611291223002-62f62dbba1a2?auto=format&fit=crop&w=500&q=80" >
      <h2>Leather Strap Watch</h2>
      <p class="price">₹2,499</p>
      <button type="button">Buy Now</button>
    </div>

    <div class="grid-child">
      <img src="https://images.unsplash.com/photo-1624522032510-44b9b792d2a9?auto=format&fit=crop&w=500&q=80">
      <h2>Smart Watch</h2>
      <p class="price">₹3,499</p>
      <button type="button">Buy Now</button>
    </div>
  </main>
</body>
</html>
